[project]
name = "prediction-market-velocity"
version = "0.0.0"
description = "Prediction-market velocity research and trading system."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmv"]

[tool.uv]
python-preference = "only-system"

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplifications
    "DTZ",  # naive datetimes forbidden
    "S",    # security (bandit)
    "BLE",  # blind except
    "T20",  # print statements
    "PT",   # pytest style
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]
